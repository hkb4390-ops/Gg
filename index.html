<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Board Course & Video Viewer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="bg-indigo-600 p-2 rounded-xl text-white">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Target Board App</h1>
                    <p class="text-xs text-slate-400">Backend API Course Viewer</p>
                </div>
            </div>
            <!-- Search bar -->
            <div class="w-full sm:w-80 relative" id="search-container">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" onkeyup="filterCourses()" placeholder="Search courses..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-indigo-500 text-sm placeholder-slate-400">
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Breadcrumb / Back button bar -->
        <div id="navigationBar" class="mb-6 hidden items-center justify-between bg-slate-800 p-3 rounded-lg border border-slate-700">
            <button onclick="goHome()" class="flex items-center space-x-2 text-indigo-400 hover:text-indigo-300 font-medium text-sm transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Courses</span>
            </button>
            <span id="breadcrumbTitle" class="text-sm font-semibold text-slate-300"></span>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500 mb-4"></div>
            <p class="text-slate-400 text-sm">Loading data from API...</p>
        </div>

        <!-- Error Box -->
        <div id="errorBox" class="hidden bg-red-900/50 border border-red-700 text-red-200 px-4 py-3 rounded-lg text-center my-10">
            <p id="errorMessage">Failed to load data.</p>
            <button onclick="fetchCourses()" class="mt-3 bg-red-700 hover:bg-red-600 text-white px-4 py-1.5 rounded text-sm font-medium transition">Retry</button>
        </div>

        <!-- Courses Grid View -->
        <div id="coursesView" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-200">All Available Courses</h2>
                <span id="courseCount" class="text-xs bg-indigo-900 text-indigo-300 px-2.5 py-1 rounded-full font-medium"></span>
            </div>
            <div id="coursesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Course cards will be injected here via JS -->
            </div>
        </div>

        <!-- Course Content / Folders View -->
        <div id="contentView" class="hidden">
            <div id="contentList" class="space-y-3">
                <!-- Folders, Videos, and PDFs will be injected here -->
            </div>
        </div>

    </main>

    <!-- Video Player Modal -->
    <div id="videoModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-4xl rounded-xl overflow-hidden shadow-2xl flex flex-col">
            <div class="flex justify-between items-center p-4 border-b border-slate-700">
                <h3 class="font-semibold text-slate-200 text-sm truncate" id="videoModalTitle">Video Player</h3>
                <button onclick="closeVideoModal()" class="text-slate-400 hover:text-white text-lg px-2">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-4 bg-black flex items-center justify-center relative aspect-video">
                <div id="videoLoader" class="absolute inset-0 flex items-center justify-center bg-black/60 z-10">
                    <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-indigo-500"></div>
                </div>
                <iframe id="videoIframe" src="" class="w-full h-full border-0 rounded" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const API_BASE = "https://studyapkmod.free.nf/tbapi/api.php";
        let allCoursesData = [];

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            fetchCourses();
        });

        // 1. Fetch All Courses
        async function fetchCourses() {
            showLoading(true);
            hideError();
            document.getElementById('coursesView').classList.add('hidden');
            document.getElementById('navigationBar').classList.add('hidden');
            document.getElementById('search-container').style.display = 'block';

            try {
                let response = await fetch(`${API_BASE}?courses`);
                let data = await response.json();
                
                // Handle different possible JSON key structures
                allCoursesData = Array.isArray(data) ? data : (data.courses || data.data || []);
                
                displayCourses(allCoursesData);
                document.getElementById('courseCount').innerText = `${allCoursesData.length} Courses`;
                document.getElementById('coursesView').classList.remove('hidden');
            } catch (err) {
                console.error("API Error:", err);
                showError("Could not connect to API or parse response. Please check network.");
            } finally {
                showLoading(false);
            }
        }

        // Display Courses Grid
        function displayCourses(courses) {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = '';

            if (courses.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">No courses found.</div>`;
                return;
            }

            courses.forEach(course => {
                let courseId = course._id || course.id || course.course_id;
                let title = course.title || course.name || "Untitled Course";
                let thumbnail = course.thumbnail || course.image || "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500&auto=format&fit=crop&q=60";
                let desc = course.description || course.subtitle || "Access complete video lectures and study material.";

                let card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 rounded-xl overflow-hidden hover:border-indigo-500 transition shadow-md flex flex-col justify-between cursor-pointer group";
                card.onclick = () => loadCourseContent(courseId, title);

                card.innerHTML = `
                    <div>
                        <div class="h-40 overflow-hidden bg-slate-700 relative">
                            <img src="${thumbnail}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-slate-100 text-base mb-1 line-clamp-2">${title}</h3>
                            <p class="text-xs text-slate-400 line-clamp-2">${desc}</p>
                        </div>
                    </div>
                    <div class="px-4 pb-4 pt-0 flex justify-between items-center">
                        <span class="text-xs text-indigo-400 font-medium">Explore Course</span>
                        <i class="fa-solid fa-chevron-right text-xs text-indigo-400"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Search Filter
        function filterCourses() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allCoursesData.filter(c => {
                let title = (c.title || c.name || "").toLowerCase();
                return title.includes(query);
            });
            displayCourses(filtered);
        }

        // 2. Load Course Content by ID (Folders/Videos/PDFs)
        async function loadCourseContent(courseId, courseTitle) {
            showLoading(true);
            hideError();
            document.getElementById('coursesView').classList.add('hidden');
            document.getElementById('search-container').style.display = 'none';

            document.getElementById('breadcrumbTitle').innerText = courseTitle;
            document.getElementById('navigationBar').classList.remove('hidden');

            try {
                let response = await fetch(`${API_BASE}?courseid=${courseId}`);
                let data = await response.json();
                
                renderContentTree(data);
                document.getElementById('contentView').classList.remove('hidden');
            } catch (err) {
                console.error("Content API Error:", err);
                showError("Failed to load course contents.");
            } finally {
                showLoading(false);
            }
        }

        // Render Folders, Videos & Files recursively or flat
        function renderContentTree(data) {
            const container = document.getElementById('contentList');
            container.innerHTML = '';

            // Handle different possible payload formats (folders/contents array)
            let items = Array.isArray(data) ? data : (data.content || data.folders || data.data || [data]);

            if (!items || items.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400">No content available inside this course.</div>`;
                return;
            }

            items.forEach(item => {
                createItemElement(item, container);
            });
        }

        function createItemElement(item, parentContainer) {
            let title = item.title || item.name || item.filename || "Untitled Item";
            let type = (item.type || item.content_type || "").toLowerCase();
            let assetId = item.asset_id || item.video_id || item.id;
            let fileUrl = item.url || item.file_url;

            let el = document.createElement('div');
            el.className = "bg-slate-800 border border-slate-700 p-4 rounded-xl flex items-center justify-between hover:bg-slate-750 transition";

            let icon = "fa-folder text-amber-400";
            let actionHtml = "";

            if (type.includes('video') || assetId) {
                icon = "fa-video text-indigo-400";
                actionHtml = `<button onclick="fetchAndPlayVideo('${assetId || item.id}', '${title}')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded text-xs font-medium transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-play"></i><span>Play Video</span>
                </button>`;
            } else if (type.includes('pdf') || type.includes('document')) {
                icon = "fa-file-pdf text-red-400";
                actionHtml = fileUrl ? `<a href="${fileUrl}" target="_blank" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded text-xs font-medium transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-download"></i><span>Open PDF</span>
                </a>` : `<span class="text-xs text-slate-500">Not Available</span>`;
            } else {
                // Folder or generic item
                actionHtml = `<span class="text-xs text-slate-400 font-medium">Folder</span>`;
            }

            el.innerHTML = `
                <div class="flex items-center space-x-3 overflow-hidden">
                    <i class="fa-solid ${icon} text-lg w-6 text-center"></i>
                    <span class="text-sm font-medium text-slate-200 truncate">${title}</span>
                </div>
                <div>${actionHtml}</div>
            `;
            parentContainer.appendChild(el);
        }

        // 3. Fetch Video URL by Asset ID and Open Player
        async function fetchAndPlayVideo(assetId, videoTitle) {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('videoIframe');
            const loader = document.getElementById('videoLoader');
            
            document.getElementById('videoModalTitle').innerText = videoTitle;
            modal.classList.remove('hidden');
            loader.style.display = 'flex';
            iframe.src = "";

            try {
                let response = await fetch(`${API_BASE}?video=${assetId}`);
                let data = await response.json();
                
                // Extract video url from response
                let videoUrl = data.url || data.video_url || data.link || (typeof data === 'string' ? data : "");
                
                if (videoUrl) {
                    iframe.src = videoUrl;
                } else {
                    alert("Video URL not found in API response.");
                    closeVideoModal();
                }
            } catch (err) {
                console.error("Video API Error:", err);
                alert("Failed to fetch video stream URL.");
                closeVideoModal();
            } finally {
                loader.style.display = 'none';
            }
        }

        function closeVideoModal() {
            document.getElementById('videoModal').classList.add('hidden');
            document.getElementById('videoIframe').src = "";
        }

        // Navigation helpers
        function goHome() {
            document.getElementById('contentView').classList.add('hidden');
            document.getElementById('navigationBar').classList.add('hidden');
            document.getElementById('coursesView').classList.remove('hidden');
            document.getElementById('search-container').style.display = 'block';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        function showError(msg) {
            document.getElementById('errorMessage').innerText = msg;
            document.getElementById('errorBox').classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorBox').classList.add('hidden');
        }
    </script>
</body>
</html>
